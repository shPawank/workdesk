<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | WorkDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            flex-direction: column;
        }

        .brand {
            color: #2563eb;
            font-size: 32px;
            font-weight: 700;
            text-decoration: none;
        }

        .app-header {
            background: white;
            padding: 16px 30px;
            border-bottom: 1px solid #e5e7eb;
        }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,.04);
        }

        .form-control {
            padding: 12px;
        }

        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
            padding: 11px;
        }
    </style>
</head>

<body>
<header class="app-header">
    <a href="/" class="brand">WorkDesk</a>
</header>

<main class="auth-container">
    <section class="auth-card">
        <h2 class="fw-bold mb-2">Create your account</h2>
        <p class="text-secondary mb-4">
            Get started with your personal workspace.
        </p>

        <form action="/users" method="post">
            <div class="mb-3">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" id="full_name" name="full_name"
                       class="form-control"
                       placeholder="Enter your full name"
                       autocomplete="name" required>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username"
                       class="form-control"
                       placeholder="Choose a username"
                       autocomplete="username" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email"
                       class="form-control"
                       placeholder="you@example.com"
                       autocomplete="email" required>
            </div>

            <div class="mb-4">
                <label for="password_hash" class="form-label">Password</label>
                <input type="password" id="password_hash"
                       name="password_hash"
                       class="form-control"
                       placeholder="Create a password"
                       autocomplete="new-password"
                       minlength="8" required>
                <small class="text-secondary">
                    Use at least 8 characters.
                </small>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Create Account
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            Already have an account?
            <a href="/login" class="fw-semibold">Sign in</a>
        </p>
    </section>
</main>
</body>
</html>
